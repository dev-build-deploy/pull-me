# A glossary term must be explained the first time it is used: followed by a parenthesis, a colon or a dash.
# pull-me fills in the terms from the shipped glossary, the repository's glossary file and .pull-me.json.
extends: conditional
message: "Explain '%s' the first time you use it: the reader may not know the term."
level: warning
ignorecase: true
first: '\b(GLOSSARY)\b'
second: '\b(GLOSSARY)\b\s*(?:\(|:|—|–| - )'
