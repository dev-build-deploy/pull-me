# The Vale configuration pull-me ships. pull-me copies the DevBuildDeploy style next to a copy of this file, fills in
# the glossary terms, the reference patterns and the known abbreviations, and applies the rule levels from
# .pull-me.json. A repository can replace this file completely with "vale": { "config": "path/to/.vale.ini" }.
StylesPath = styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = DevBuildDeploy
DevBuildDeploy.Readability = NO
